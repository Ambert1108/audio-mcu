[main]
ip=10.1.63.110               ;远程服务器地址        
port=5060                    ;远程服务器端口
sip_port=54321               ;sip端口
user=faust                   ;sip账号用户名
pwd=123456                   ;sip账号密码
port_point=62300             ;UDP端口起点
port_range=200               ;UDP端口区间
auto_stop=15                 ;任务超过设定时间自动关闭，单位s
call_back=1                  ;高亮显示回调间隔，单位s

[log]
log_name=record.log          ;输出日志文件名
log_level=2                  ;日志输出等级，默认为2:INFO
std_out=true                 ;是否开启标准输出，现网环境应该关闭
hpu_check_interval=3         ;hpu状态检查/输出间隔，单位s
mcu_check_interval=3         ;mcu状态检查/输出间隔，单位s
mpu_check_interval=1		     ;mpu状态检查/输出间隔，单位s
auto_check_interval=300      ;自动关闭检查间隔，单位ms

[media]
ip=10.1.69.7                 ;EPG发流ip地址
payload_type=97              ;音频有效载荷类型
db_threshold=55              ;高亮显示分贝阈值
no_voice_time=3              ;取消高亮时间，单位s

[test]
save_input=0                 ;0:不保存输入数据, 1:保存输入数据
save_output=0                ;0:不保存输出数据, 1:保存输出数据