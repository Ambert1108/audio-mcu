[main]
ip=127.0.0.1                 ;接收http请求地址        
port=54321                   ;接收http请求端口
port_point=62300             ;音频流监听端口起点
port_range=200               ;音频流监听端口区间
device_id=0                  ;硬件加速设备编号
auto_stop=15                 ;任务超过设定时间自动关闭，单位s

[log]
log_name=record.log          ;输出日志文件名
log_level=2                  ;日志输出等级，默认为2:INFO
std_out=true                 ;是否开启标准输出，现网环境应该关闭
hpu_check_interval=3         ;hpu状态检查/输出间隔，单位s
mcu_check_interval=3         ;mcu状态检查/输出间隔，单位s
mpu_check_interval=1		 ;mpu状态检查/输出间隔，单位s
auto_check_interval=300      ;自动关闭检查间隔，单位ms

[media]
ip=127.0.0.1                 ;EPG发流ip地址
codec_type=1                 ;音频编码格式，1：PCMA
sample_rate=8000             ;编码输出音频采样率
bit_rate=960                 ;编码输出音频码率，单位kb/s
payload_type=97              ;音频有效载荷类型