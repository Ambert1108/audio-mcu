[log]
log_name=record.log          ;输出日志文件名
log_level=2                  ;日志输出等级，默认为2:INFO
std_out=true                 ;是否开启标准输出，现网环境应该关闭
hpu_check_interval=30        ;hpu状态检查/输出间隔，单位s
mcu_check_interval=10        ;mcu状态检查/输出间隔，单位s
mem_check_interval=5         ;内存相关信息检查间隔，单位s
mem_print_interval=60        ;内存相关信息输出间隔，单位s
mpu_check_interval=5		     ;mpu状态检查/输出间隔，单位s
auto_check_interval=300      ;自动关闭检查间隔，单位ms

[media]
ip=10.1.69.7                 ;内网发流ip地址
nat_ip=10.1.69.7             ;nat
payload_type=97              ;音频有效载荷类型
db_threshold=55              ;高亮显示分贝阈值
no_voice_time=3              ;取消高亮时间，单位s

[test]
is_http=false                ;使用http协议模式
