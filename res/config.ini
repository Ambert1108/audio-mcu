[main]
ip=10.1.63.112               ;远程服务器地址        
port=51255                   ;远程服务器端口
sip_ip=10.1.69.7             ;本地sip监听ip
sip_port=54325               ;本地sip监听端口
user=faust                   ;sip账号用户名
pwd=123456                   ;sip账号密码
port_point=62600             ;UDP端口起点
port_range=200               ;UDP端口区间
auto_stop=15                 ;任务超过设定时间自动关闭，单位s
